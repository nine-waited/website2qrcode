server {
    listen 80;
    listen [::]:80;
    server_name nineee.xyz www.nineee.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nineee.xyz www.nineee.xyz;

    ssl_certificate     /etc/letsencrypt/live/nineee.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nineee.xyz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /website2qrcode {
        return 301 /website2qrcode/;
    }

    location /website2qrcode/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    location = / {
        default_type text/plain;
        return 200 "nineee.xyz\n";
    }

    location / {
        return 404;
    }
}
