<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>website2qrcode</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3845;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --accent-2: #2f7fbf;
      --danger: #c45c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a3a 0%, var(--bg) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 110px;
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.92rem;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }
    button:hover { background: var(--accent-2); }
    button.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
    }
    button.secondary:hover { border-color: var(--muted); }
    button.danger {
      background: transparent;
      border: 1px solid var(--line);
      color: #e8b4b4;
    }
    button.danger:hover { border-color: var(--danger); color: #ffd0d0; }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .preview {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      border: 1px dashed var(--line);
      background: rgba(26, 34, 44, 0.7);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .preview.empty { color: var(--muted); font-size: 0.9rem; }
    #qr {
      display: none;
      padding: 12px;
      background: #fff;
      border-radius: 8px;
      line-height: 0;
    }
    #qr img, #qr canvas { display: block; }
    .hint {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
    .err {
      margin-top: 10px;
      color: #ffb4b4;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>website2qrcode</h1>
    <p class="sub">输入网址生成二维码。不在服务端保存任何内容；用完可一键清空。</p>

    <label for="url">网站地址</label>
    <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
           maxlength="2048" placeholder="https://example.com" />

    <div class="row">
      <button id="btnGen" type="button">生成</button>
      <button id="btnDl" class="secondary" type="button" disabled>下载图片</button>
      <button id="btnClear" class="danger" type="button">清空</button>
    </div>
    <div class="err" id="err" aria-live="polite"></div>

    <div class="preview empty" id="preview">
      <span id="placeholder">二维码预览区</span>
      <div id="qr"></div>
    </div>
    <p class="hint">内存生成 · 无上传 · 无缓存 · 刷新即消失</p>
  </main>

  <script src="./qrcode.min.js"></script>
  <script>
    (function () {
      const urlInput = document.getElementById("url");
      const btnGen = document.getElementById("btnGen");
      const btnDl = document.getElementById("btnDl");
      const btnClear = document.getElementById("btnClear");
      const err = document.getElementById("err");
      const preview = document.getElementById("preview");
      const placeholder = document.getElementById("placeholder");
      const qrBox = document.getElementById("qr");

      let qr = null;
      let objectUrl = null;
      const MAX_LEN = 2048;
      const ALLOWED_PROTOCOLS = { "http:": true, "https:": true };

      function revoke() {
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = null;
        }
      }

      function wipeQrDom() {
        qrBox.innerHTML = "";
        qrBox.style.display = "none";
        placeholder.style.display = "";
        preview.classList.add("empty");
        btnDl.disabled = true;
        qr = null;
      }

      function clearAll() {
        revoke();
        wipeQrDom();
        urlInput.value = "";
        err.textContent = "";
        urlInput.focus();
      }

      function setError(msg) {
        // 只用 textContent，避免把用户输入写进 HTML
        err.textContent = msg || "";
      }

      /** 清洗并校验：仅允许 http/https，拒绝 javascript/data 等注入型协议 */
      function sanitizeUrl(raw) {
        if (raw == null) return { ok: false, error: "请输入网站地址" };

        // 去掉 BOM / 零宽 / 控制字符，防止隐藏注入
        let s = String(raw)
          .replace(/[\u0000-\u001F\u007F\u200B-\u200D\uFEFF]/g, "")
          .trim();

        if (!s) return { ok: false, error: "请输入网站地址" };
        if (s.length > MAX_LEN) return { ok: false, error: "地址过长（最多 2048 字符）" };

        // 拒绝明显 HTML / 脚本片段
        if (/[<>"`]/.test(s) || /javascript\s*:/i.test(s) || /data\s*:/i.test(s) || /vbscript\s*:/i.test(s)) {
          return { ok: false, error: "地址含非法字符或危险协议" };
        }

        // 无协议时补 https（仅域名形态）
        if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) {
          if (/^(localhost|(\d{1,3}\.){3}\d{1,3}|[\w-]+(\.[\w-]+)+)(:\d+)?([/?#].*)?$/i.test(s)) {
            s = "https://" + s;
          } else {
            return { ok: false, error: "地址格式无效" };
          }
        }

        let u;
        try {
          u = new URL(s);
        } catch (_) {
          return { ok: false, error: "地址格式无效" };
        }

        const protocol = (u.protocol || "").toLowerCase();
        if (!ALLOWED_PROTOCOLS[protocol]) {
          return { ok: false, error: "仅支持 http:// 或 https://" };
        }

        // 禁止用户名密码嵌入（降低钓鱼二维码风险）
        if (u.username || u.password) {
          return { ok: false, error: "不允许在地址中携带账号密码" };
        }

        if (!u.hostname) {
          return { ok: false, error: "缺少有效主机名" };
        }

        // 主机名只允许常见安全字符
        if (!/^[a-z0-9.-]+$/i.test(u.hostname) && u.hostname !== "localhost") {
          // 允许 IPv6：[::1]
          if (!(u.hostname.startsWith("[") && u.hostname.endsWith("]"))) {
            return { ok: false, error: "主机名含非法字符" };
          }
        }

        // 用 URL 规范化后的 href，去掉意外空白
        const safe = u.href;
        if (safe.length > MAX_LEN) {
          return { ok: false, error: "地址过长（最多 2048 字符）" };
        }
        return { ok: true, url: safe };
      }

      function generate() {
        setError("");
        revoke();
        wipeQrDom();

        // 同步裁剪输入框，避免粘贴超长内容
        if (urlInput.value.length > MAX_LEN) {
          urlInput.value = urlInput.value.slice(0, MAX_LEN);
        }

        const result = sanitizeUrl(urlInput.value);
        if (!result.ok) {
          setError(result.error);
          return;
        }

        // 写回规范化后的安全 URL，避免界面残留危险原文
        urlInput.value = result.url;

        placeholder.style.display = "none";
        preview.classList.remove("empty");
        qrBox.style.display = "block";
        qr = new QRCode(qrBox, {
          text: result.url,
          width: 256,
          height: 256,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
        btnDl.disabled = false;
      }

      function getCanvas() {
        return qrBox.querySelector("canvas");
      }

      function download() {
        const canvas = getCanvas();
        if (!canvas) {
          setError("请先生成二维码");
          return;
        }
        revoke();
        canvas.toBlob(function (blob) {
          if (!blob) {
            setError("导出失败");
            return;
          }
          objectUrl = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = objectUrl;
          a.download = "website2qrcode.png";
          document.body.appendChild(a);
          a.click();
          a.remove();
          // 下载触发后尽快释放临时对象 URL
          setTimeout(revoke, 1000);
        }, "image/png");
      }

      btnGen.addEventListener("click", generate);
      btnDl.addEventListener("click", download);
      btnClear.addEventListener("click", clearAll);
      urlInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") generate();
      });
      urlInput.addEventListener("paste", function () {
        setTimeout(function () {
          let v = urlInput.value.replace(/[\u0000-\u001F\u007F\u200B-\u200D\uFEFF]/g, "");
          if (v.length > MAX_LEN) v = v.slice(0, MAX_LEN);
          urlInput.value = v;
        }, 0);
      });

      // 离开页面时清理
      window.addEventListener("pagehide", clearAll);
      window.addEventListener("beforeunload", revoke);
    })();
  </script>
</body>
</html>
